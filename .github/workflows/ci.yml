name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches the Dockerfile base image.
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.in

      - name: Lint
        run: ruff check .

      - name: Tests
        env:
          SPOTIFY_CLIENT_ID: test
          SPOTIFY_CLIENT_SECRET: test
          SPOTIFY_REFRESH_TOKEN: test
        run: pytest -q

      - name: Import smoke (server wires up its full tool surface)
        env:
          SPOTIFY_CLIENT_ID: test
          SPOTIFY_CLIENT_SECRET: test
          SPOTIFY_REFRESH_TOKEN: test
        run: |
          python -c "
          import asyncio, server
          tools = asyncio.run(server.mcp.list_tools())
          names = sorted(t.name for t in tools)
          # Presence, not an exact count: a count breaks on every added tool.
          core = {
              'search_artist', 'get_artist_top_tracks', 'create_playlist_from_artists',
              'add_artists_to_playlist', 'create_playlist_from_tracks',
              'list_my_playlists', 'get_playlist_metadata', 'list_playlist_tracks',
              'update_playlist', 'delete_playlist', 'remove_tracks_from_playlist',
              'search_spotify', 'play_music', 'current_playback', 'liked_songs',
              'get_album', 'save_to_library', 'top_items',
          }
          missing = core - set(names)
          assert not missing, sorted(missing)
          print('tools:', names)
          "

      - name: Lockfile is in sync with requirements.in
        run: |
          pip install uv==0.12.5
          # Recompile under the SAME output filename in a scratch directory.
          # uv records the -o path in the file's header comment, so compiling
          # to a different name guarantees a one-line diff and a check that can
          # never pass.
          mkdir -p /tmp/lockcheck
          cp requirements.in /tmp/lockcheck/
          (cd /tmp/lockcheck && uv pip compile requirements.in -o requirements.lock \
            --generate-hashes --universal --python-version 3.13 --quiet)
          diff -u requirements.lock /tmp/lockcheck/requirements.lock \
            || (echo "::error::requirements.lock is stale; regenerate it with:
          uv pip compile requirements.in -o requirements.lock --upgrade --generate-hashes --universal --python-version 3.13" && exit 1)

  scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Tags carry a leading "v". Versions below v0.35.0 are affected by the
      # brief Trivy ecosystem supply chain compromise; do not pin back.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: mcp-spotify:ci
          # SBOM and provenance attestations produce a manifest list, which the
          # local docker exporter cannot load. This job only needs to prove the
          # image builds, so it does not set `load` and nothing is exported.
          sbom: true
          provenance: true

      # A second, attestation-free pass so the image is actually loadable into
      # the docker daemon. Every layer is a cache hit off the build above.
      - name: Load a runnable copy for the interpreter guard
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: mcp-spotify:guard

      - name: Assert the image ships the Python minor version we target
        # Guard rail for the digest-bump trap. Every other job in this workflow
        # runs on actions/setup-python 3.13, so nothing here ever executes the
        # *image's* interpreter. That let a Dependabot base-image bump move the
        # Dockerfile FROM tag from 3.13 to 3.14 and ship a runtime no lockfile
        # or check had exercised, with CI fully green throughout.
        #
        # requirements.lock is compiled with --python-version 3.13, so the image
        # must agree. --entrypoint is required: the image's ENTRYPOINT is the
        # server itself.
        run: |
          docker run --rm --entrypoint python mcp-spotify:guard -c '
          import sys
          want = (3, 13)
          got = sys.version_info[:2]
          assert got == want, (
              f"image ships Python {sys.version.split()[0]}, but requirements.lock "
              f"and the CI matrix target {want[0]}.{want[1]}. Fix the Dockerfile "
              f"FROM tag, or retarget every version surface together."
          )
          print(f"image Python {sys.version.split()[0]} matches target {want[0]}.{want[1]}")
          '
